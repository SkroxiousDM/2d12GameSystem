name: Build core rulebook
on:
  push:
    branches: [main]
    paths-ignore:
      - 'pdf/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: book-pdf-commit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Prepare output directory
        run: mkdir -p build/core-beliefs pdf
      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.13.1'
      - name: Fetch book fonts
        run: |
          set -euo pipefail
          {
            git clone --depth 1 --filter=blob:none --sparse https://github.com/google/fonts.git .build-fonts
            git -C .build-fonts sparse-checkout set ofl/ebgaramond ofl/sourcesans3
            git -C .build-fonts rev-parse HEAD
            test -n "$(find .build-fonts/ofl/ebgaramond -name '*.ttf' -print -quit)"
            test -n "$(find .build-fonts/ofl/sourcesans3 -name '*.ttf' -print -quit)"
          } 2>&1 | tee build/core-beliefs/font-setup.log
      - name: Record compiler and available fonts
        run: |
          set -euo pipefail
          git rev-parse HEAD > build/core-beliefs/source-commit.txt
          typst --version | tee build/core-beliefs/build-info.txt
          typst fonts --font-path .build-fonts/ofl > build/core-beliefs/fonts.txt
          grep -Fx 'EB Garamond' build/core-beliefs/fonts.txt
          grep -Fx 'Source Sans 3' build/core-beliefs/fonts.txt
      - name: Compile the full core rulebook
        run: |
          set -euo pipefail
          typst compile --root . --font-path .build-fonts/ofl docs/2d12System/the-2d12-system-v2-core-rulebook.typ pdf/the-2d12-system-v2-core-rulebook.pdf 2>&1 | tee build/core-beliefs/compile.log
          test -s pdf/the-2d12-system-v2-core-rulebook.pdf
      - name: Commit generated PDF
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- pdf/the-2d12-system-v2-core-rulebook.pdf
          if git diff --cached --quiet; then
            echo 'Core rulebook PDF is unchanged.'
            exit 0
          fi
          git commit -m 'docs: update core rulebook PDF [skip ci]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Upload PDF and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-rulebook-${{ github.run_number }}
          path: |
            pdf/the-2d12-system-v2-core-rulebook.pdf
            build/core-beliefs/
          if-no-files-found: warn
          retention-days: 2
      - name: Write build summary
        if: always()
        run: |
          {
            echo '## Core rulebook build'
            echo 'Repository output: pdf/the-2d12-system-v2-core-rulebook.pdf'
            echo 'See the commit step for publication status and the artifact for diagnostic logs.'
          } >> "$GITHUB_STEP_SUMMARY"
