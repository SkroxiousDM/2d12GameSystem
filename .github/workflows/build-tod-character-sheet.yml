name: Build Testament of Dust character sheet
on:
  push:
    branches: [main]
    paths-ignore:
      - 'pdf/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: book-pdf-commit-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Prepare output directory
        run: mkdir -p build/tod-character-sheet pdf
      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.13.1'
      - name: Fetch sheet fonts
        run: |
          set -euo pipefail
          {
            git clone --depth 1 --filter=blob:none --sparse https://github.com/google/fonts.git .build-fonts
            git -C .build-fonts sparse-checkout set ofl/ebgaramond ofl/cinzel
            git -C .build-fonts rev-parse HEAD
            test -n "$(find .build-fonts/ofl/ebgaramond -name '*.ttf' -print -quit)"
            test -n "$(find .build-fonts/ofl/cinzel -name '*.ttf' -print -quit)"
          } 2>&1 | tee build/tod-character-sheet/font-setup.log
      - name: Record compiler and available fonts
        run: |
          set -euo pipefail
          git rev-parse HEAD > build/tod-character-sheet/source-commit.txt
          typst --version | tee build/tod-character-sheet/build-info.txt
          typst fonts --font-path .build-fonts/ofl > build/tod-character-sheet/fonts.txt
          grep -Fx 'EB Garamond' build/tod-character-sheet/fonts.txt
          grep -Fx 'Cinzel' build/tod-character-sheet/fonts.txt
      - name: Compile character sheet
        run: |
          set -euo pipefail
          typst compile --root . --font-path .build-fonts/ofl docs/TestamentOfDust/2d12-character-sheet-v2.typ pdf/2d12-character-sheet-v2.pdf 2>&1 | tee build/tod-character-sheet/compile.log
          test -s pdf/2d12-character-sheet-v2.pdf
      - name: Commit generated PDF
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- pdf/2d12-character-sheet-v2.pdf
          if git diff --cached --quiet; then
            echo 'Character sheet PDF is unchanged.'
            exit 0
          fi
          git commit -m 'docs: update character sheet PDF [skip ci]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Upload PDF and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tod-character-sheet-${{ github.run_number }}
          path: |
            pdf/2d12-character-sheet-v2.pdf
            build/tod-character-sheet/
          if-no-files-found: warn
          retention-days: 2
      - name: Write build summary
        if: always()
        run: |
          {
            echo '## Testament of Dust character sheet build'
            echo 'Repository output: pdf/2d12-character-sheet-v2.pdf'
            echo 'See the commit step for publication status and the artifact for diagnostic logs.'
          } >> "$GITHUB_STEP_SUMMARY"
